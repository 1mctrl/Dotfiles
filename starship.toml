add_newline = false
command_timeout = 700

format = '$shell$directory$git_branch$git_state$git_status$nodejs$python$c$rust$golang$java$sudo$fill$status$cmd_duration$jobs$line_break$character'

[shell]
disabled = false
format = '[$indicator]($style) '
style = 'blue'
zsh_indicator = ' zsh'
bash_indicator = ' bsh'
unknown_indicator = 'sh'

[directory]
truncation_length = 3
truncate_to_repo = true
format = '[$path]($style)[$read_only]($read_only_style) '
style = 'bright-black'
repo_root_style = 'bold white'
read_only = ' '
read_only_style = 'red'

[git_branch]
symbol = ' '
format = '[$symbol$branch]($style) '
style = 'blue'

[git_state]
format = '[$state( $progress_current/$progress_total)]($style) '
style = 'yellow'

[git_status]
format = '[$all_status$ahead_behind]($style) '
style = 'red'
conflicted = '=${count}'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
untracked = '?${count}'
modified = '!${count}'
staged = '+${count}'
renamed = '»${count}'
deleted = '✘${count}'
stashed = '$${count}'

[nodejs]
format = '󰎙 [$version]($style) '
style = 'bright-black'
detect_files = ['package.json', '.node-version', '.nvmrc']
detect_extensions = []
detect_folders = []

[python]
format = ' [$version]($style) '
style = 'bright-black'
detect_files = ['pyproject.toml', 'requirements.txt', 'setup.py', 'Pipfile']
detect_extensions = ['py']
detect_folders = ['.venv', 'venv']

[c]
format = ' [$version]($style) '
style = 'bright-black'
detect_extensions = ['c', 'h']
detect_files = ['Makefile', 'makefile', 'CMakeLists.txt', 'compile_commands.json']
detect_folders = []

[rust]
format = ' [$version]($style) '
style = 'bright-black'

[golang]
format = ' [$version]($style) '
style = 'bright-black'

[java]
format = ' [$version]($style) '
style = 'bright-black'

[sudo]
disabled = false
format = '[root-cache](bold red) '

[status]
disabled = false
symbol = '✘ '
format = '[$symbol$status]($style) '
style = 'red'

[cmd_duration]
min_time = 1000
format = '[took $duration](blue) '

[jobs]
format = '[jobs:$number](blue) '

[fill]
symbol = ' '

[character]
success_symbol = '[](bold white) '
error_symbol = '[](red) '