# ======================
#   SWAYFX EFFECTS
# ======================

# Blur
blur enable
blur_radius 12
blur_passes 3
blur_brightness 0.75
blur_noise 0.03
blur_popups enable

# Shadows
shadow enable
shadow_range 20
shadow_render_power 5
shadow_color 0x00000088

# Rounded corners
corner_radius 8

# Opacity (optional)
inactive_opacity 0.9
active_opacity 1.0

# Animations block
animations yes
animation_duration 180
animation_stiffness 130
animation_damping 18

# Window animations
animation_in_window yes
animation_out_window yes
animation_move yes
animation_resize yes
animation_workspace yes
